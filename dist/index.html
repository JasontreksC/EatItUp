<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eat It Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500&family=Orbitron:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-CHiKeVxZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-23h4W6kK.css">
  </head>
  <body>
    <!--
      구조:
        overlay   — 시작 전 안내/버튼
        webcam    — 숨겨진 비디오 (인식 + 배경 소스)
        stage     — 캔버스 + 게임 UI 오버레이
    -->
    <div id="app">
      <div id="overlay" class="overlay">
        <h1>Eat It Up</h1>
        <p>얼굴을 비추면 플레이가 시작됩니다. 최대 3명, 입을 벌려 건강한 음식을 먹으세요.</p>
        <button id="start-btn" type="button">카메라 켜고 시작</button>
        <label class="volume-control" for="bgm-volume">
          <span class="volume-control__label">배경음악</span>
          <input
            id="bgm-volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="45"
          />
        </label>
        <p id="status-msg" class="status-msg" hidden></p>
      </div>

      <video id="webcam" playsinline muted hidden></video>

      <div id="stage" class="stage">
        <canvas id="game" width="640" height="480"></canvas>
        <div id="ui-layer" class="ui-layer">
          <!-- 머리 위를 추적하는 점수 카드 레이어 -->
          <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
          <div id="fx-root" class="fx-root"></div>
          <button id="quit-btn" class="quit-btn" type="button" hidden>
            게임 종료
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
