server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 에셋 캐시
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /foods/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /sounds/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 진입점
    location / {
        try_files $uri $uri/ /index.html;
    }
}
